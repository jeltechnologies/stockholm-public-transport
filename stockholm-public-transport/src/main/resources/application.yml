spring:
  application:
    name: transporttimes
  jackson:
    default-property-inclusion: non-empty
    deserialization:
      fail-on-null-for-primitives: false
  ai:
    mcp:
      server:
        name: transporttimes
        version: 1.0.0
        type: sync
        stdio: false
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /api/v1/mcp
        resource-change-notification: true
        tool-change-notification: true
        prompt-change-notification: true
server:
  port: 18107
logging:
  level:
    io:
      modelcontextprotocol: TRACE
    org:
      springframework:
        ai:
          mcp: TRACE
        web:
          client: TRACE
    com:
       jeltechnologies:
         mcp: DEBUG
